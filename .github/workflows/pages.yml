name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build static files
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          METRIKA_ID: ${{ vars.METRIKA_ID }}
        run: |
          unzip -q vkusno-prosto-github.zip -d project
          python3 project/build_pages.py --base-url "$SITE_URL" --metrika-id "$METRIKA_ID" --output dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
